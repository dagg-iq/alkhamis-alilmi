# فحص طابور فهرسة الكتب (قراءة فقط): حالة الكتب والأجزاء وأقفال النماذج وتشغيلات العامل
name: Inspect book ingest
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/inspect-ingest.yml']

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print queue state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            jq -n --arg q "$1" '{query: $q, read_only: true}' | curl -sS -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- | jq -c '.[]?' || true
            echo
          }
          echo "===== now"; q "select now(), now() at time zone 'Asia/Baghdad' as baghdad"
          echo "===== documents (not done or queued)"
          q "select left(title,50) t, kind, pages, ingested_pages, ingest_status, left(ingest_error,160) err, outline_status, left(outline_error,120) oerr, queued_at from documents where queued_at is not null or ingest_status is distinct from 'done' or ingested_pages < pages order by queued_at nulls last"
          echo "===== chunks by doc/status"
          q "select left(d.title,40) t, c.status, count(*) n, min(c.from_page) fp, max(c.to_page) tp, max(c.attempts) att, min(c.next_at) next_at, max(c.lease_until) lease, max(left(c.last_error,140)) err from ingest_chunks c join documents d on d.id = c.document_id group by 1,2 order by 1,2"
          echo "===== chunk errors (distinct)"
          q "select left(last_error,200) e, status, count(*) from ingest_chunks where last_error is not null group by 1,2 order by 3 desc limit 30"
          echo "===== active model blocks (count by model/reason)"
          q "select model, left(reason,60) reason, count(*) keys, min(blocked_until) until from ai_key_blocks where blocked_until > now() group by 1,2 order by 1"
          echo "===== usage today by model (Pacific day)"
          q "select model, sum(requests) req, sum(errors) err, max(last_at) last_at, max(left(last_error,120)) sample_err from ai_key_usage where day = (now() at time zone 'America/Los_Angeles')::date group by 1 order by 1"
          echo "===== worker lock"
          q "select key, value, updated_at from private.settings where key in ('ingest_lock')"
          echo "===== cron runs"
          q "select status, left(return_message,120) msg, start_time from cron.job_run_details where jobid in (select jobid from cron.job where jobname='saey-ingest') order by start_time desc limit 8"
          echo "===== pg_net responses to worker"
          q "select id, status_code, left(content::text,200) content, left(error_msg,160) err, created from net._http_response order by created desc limit 12"
      - name: Check external file storage reachability
        run: |
          for i in 1 2 3; do
            curl -sS -m 20 -o /dev/null -w "storage.130-61-171-185.sslip.io → HTTP %{http_code} in %{time_total}s\n" https://storage.130-61-171-185.sslip.io/ || echo "storage unreachable (attempt $i)"
            sleep 5
          done
