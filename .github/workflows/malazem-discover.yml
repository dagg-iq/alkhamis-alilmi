# استكشاف ملازم من الإنترنت (قراءة فقط): يفتح صفحات scripts/malazem/pages.json ويطبع روابط التحميل
name: Discover malazem
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/malazem/pages.json', 'scripts/malazem/discover.mjs', '.github/workflows/malazem-discover.yml']

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/malazem/discover.mjs
