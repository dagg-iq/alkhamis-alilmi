# إضافة ملازم من الإنترنت (scripts/malazem/malazem.json) ووضعها في طابور فهرسة الكتب. "apply": false يحمّل ويفحص فقط.
name: Import malazem
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main, claude/repository-name-arabic-iegosv]
    paths: ['scripts/malazem/malazem.json', 'scripts/malazem/import.mjs', '.github/workflows/malazem-import.yml']

concurrency:
  group: malazem-import
  cancel-in-progress: false

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ghostscript >/dev/null
      - name: Import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CATALOG: ${{ github.workspace }}/scripts/malazem/malazem.json
        run: |
          # pdf-lib في مجلد منفصل (لا نلمس حزم المستودع)
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m" && npm init -y >/dev/null && npm i --silent pdf-lib@1.17.1
          cp "$GITHUB_WORKSPACE/scripts/malazem/import.mjs" . && node import.mjs
