# فحص جودة فهرسة المحاضرات (قراءة فقط): يطبع المواضيع المحفوظة لكل محاضرة في السجل
name: Inspect lecture index
on:
  workflow_dispatch:

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print lectures, topics and chunks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            jq -n --arg q "$1" '{query: $q, read_only: true}' | curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-
            echo
          }
          echo "===== المحاضرات"
          q "select l.title, l.duration_sec, l.index_status, l.index_error, c.number as chapter, t.name as teacher, (select count(*) from lecture_topics x where x.lecture_id = l.id) as topics from lectures l join chapters c on c.id = l.chapter_id left join teachers t on t.id = l.teacher_id order by c.number, l.sort" | jq -r '.[] | "\(.chapter) | \(.title) | \(.teacher) | \(.duration_sec)s | \(.index_status) | topics=\(.topics) | \(.index_error // "")"'
          echo "===== المواضيع"
          q "select l.title as lecture, x.start_sec, x.title, x.summary from lecture_topics x join lectures l on l.id = x.lecture_id order by l.sort, x.start_sec" | jq -r '.[] | "[\(.lecture)] \(.start_sec / 60 | floor):\(.start_sec % 60) — \(.title) :: \(.summary)"'
          echo "===== عينة من الشرح المفصل (للمساعد)"
          q "select left(content, 900) as content, start_sec from content_chunks where source_type = 'lecture' order by random() limit 4" | jq -r '.[] | "--- \(.start_sec)s\n\(.content)\n"'
