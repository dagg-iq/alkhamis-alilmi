# فحص طابور فهرسة المحاضرات (قراءة فقط): التقدم لكل مادة، المحاضرات الجارية، الأخطاء، وتشغيلات pg_cron
name: Inspect lecture queue
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/inspect-lectures.yml']

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print queue state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            jq -n --arg q "$1" '{query: $q, read_only: true}' | curl -sS -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- | jq -c '.[]?' || true
            echo
          }
          echo "===== now"; q "select now() at time zone 'Asia/Baghdad' as baghdad"
          echo "===== progress by subject"
          q "select s.slug, count(*) total, count(*) filter (where l.index_status = 'done' and l.queued_at is null) done, count(*) filter (where l.queued_at is not null) queued, count(*) filter (where l.index_segment > 0) mid, count(*) filter (where l.index_status = 'error' and l.queued_at is null) failed, (select count(*) from lecture_topics t join lectures x on x.id = t.lecture_id join chapters c2 on c2.id = x.chapter_id join books b2 on b2.id = c2.book_id where b2.subject_id = s.id) topics from lectures l join chapters c on c.id = l.chapter_id join books b on b.id = c.book_id join subjects s on s.id = b.subject_id group by s.id, s.slug, s.sort order by s.sort"
          echo "===== in progress / errors"
          q "select left(l.title,50) t, l.index_segment seg, l.index_attempts att, l.index_next_at, l.index_lease_until lease, left(l.index_error,160) err from lectures l where l.queued_at is not null and (l.index_segment > 0 or l.index_error is not null or l.index_lease_until > now()) order by l.index_next_at limit 25"
          echo "===== recently indexed"
          q "select left(l.title,50) t, l.indexed_at, (select count(*) from lecture_topics t where t.lecture_id = l.id) topics from lectures l where l.indexed_at > now() - interval '1 day' order by l.indexed_at desc limit 15"
          echo "===== usage today by model"
          q "select model, sum(requests) req, sum(errors) err, max(last_at) last_at, max(left(last_error,120)) sample_err from ai_key_usage where day = (now() at time zone 'America/Los_Angeles')::date group by 1 order by 1"
          echo "===== lock / cron"
          q "select key, value from private.settings where key = 'lecture_lock'"
          q "select status, left(return_message,120) msg, start_time from cron.job_run_details where jobid in (select jobid from cron.job where jobname='saey-lectures') order by start_time desc limit 5"
