# يبني ملف APK لتطبيق سعي وينشره في صفحة Releases
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, claude/repository-name-arabic-iegosv]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write
  # لتشغيل نشر الموقع بعد تحديث رابط التنزيل
  actions: write

concurrency:
  group: build-apk-${{ github.ref }}
  # لا نلغي بناءً جارياً عند رفع تعديل جديد؛ الجديد ينتظر دوره
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # المستودع العام للنسخ (التحديث التلقائي): يُفعَّل عند وجود السر RELEASES_TOKEN
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'dagg-iq/saey-releases' }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Firebase config (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('apps/mobile/google-services.json','utf8')); console.log('✓ google-services.json')"
          else
            echo "::warning::السر GOOGLE_SERVICES_JSON غير موجود — النسخة ستُبنى بلا إشعارات فورية."
          fi

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          # رقم النسخة داخل التطبيق (للتحديث من داخل التطبيق)
          APK_BUILD: ${{ github.run_number }}

      # توقيع النسخة بمفتاح سعي الخاص (يُنشأ مرة واحدة من سير العمل «Create Signing Key»).
      # قبل إنشائه تبقى النسخ موقّعة بمفتاح Expo العام كالسابق.
      - name: Release signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          ENC=signing/saey-release.keystore.enc
          if [ -f "$ENC" ]; then
            if [ -z "$SIGNING_PASSPHRASE" ]; then
              echo "::error::مفتاح التوقيع موجود لكن السر SIGNING_PASSPHRASE غير مضاف. لا نبني بمفتاح مختلف حتى لا ينكسر التحديث عند الطلاب."
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE -in "$ENC" -out "$RUNNER_TEMP/saey.keystore"
            {
              # كلمة السر لا تُكتب هنا (كانت ستصل لكل الخطوات التالية)؛ تُمرَّر لخطوة البناء وحدها
              echo "SAEY_KEYSTORE=$RUNNER_TEMP/saey.keystore"
              echo "SAEY_KEY_ALIAS=saey"
            } >> "$GITHUB_ENV"
            SAEY_KEYSTORE="$RUNNER_TEMP/saey.keystore" SAEY_STORE_PASSWORD="$SIGNING_PASSPHRASE" SAEY_KEY_ALIAS=saey SAEY_KEY_PASSWORD="$SIGNING_PASSPHRASE" node scripts/apply-signing.js
          else
            echo "::notice::لا يوجد مفتاح توقيع خاص بعد — النسخة موقّعة بمفتاح Expo العام."
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          APK_BUILD: ${{ github.run_number }}
          SAEY_STORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          SAEY_KEY_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          # سطر جديد أولاً: آخر سطر في الملف بلا نهاية سطر، والإلحاق المباشر كان يفسد قيمة watchedDirectories
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../../gradle.log
          exit ${PIPESTATUS[0]}

      - name: Show error details
        if: failure()
        run: |
          echo "===== node / error lines ====="
          grep -n -i -E "node|error|exception|caused by|what went wrong|at .*gradle" gradle.log | grep -v -i "warning" | head -150 || true
          echo "===== problems report ====="
          f=apps/mobile/android/build/reports/problems/problems-report.html
          [ -f "$f" ] && sed -e 's/<[^>]*>/ /g' "$f" | tr -s ' \n' | grep -i -E "node|exec|fail|error" | head -60 || true

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/saey.apk
          echo "بصمة توقيع النسخة (يجب أن تبقى ثابتة بين النسخ):"
          # النسخ الحديثة موقّعة بصيغة v2/v3 فلا يقرؤها keytool، لذلك نستخدم apksigner من أدوات أندرويد
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            # نتحقق أن الملف يُثبَّت على كل الأجهزة من أندرويد 7 (API 24) فما فوق، وأن توقيع v1 القديم موجود
            # (بدونه ترفض بعض هواتف ريلمي/أوبو القديمة الملف بـ«الحزمة غير صالحة»). أي خلل هنا يوقف النشر.
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 out/saey.apk > verify.txt || { cat verify.txt; echo "::error::ملف APK لا يجتاز التحقق من التوقيع"; exit 1; }
            grep -E 'Verified using|DN|SHA-256' verify.txt
            grep -q 'Verified using v1 scheme (JAR signing): true' verify.txt || { echo "::error::توقيع v1 غير موجود — الهواتف القديمة سترفض الملف"; exit 1; }
          else echo "apksigner غير متاح"; fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: saey-apk
          path: out/saey.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: سعي — نسخة ${{ github.run_number }}
          body: |
            ملف APK لتطبيق سعي (أندرويد). حمّل saey.apk وثبّته على الهاتف.
            الفرع: ${{ github.ref_name }} — الكود: ${{ github.sha }}
          prerelease: true
          files: out/saey.apk

      # ── التحديث التلقائي: نسخة في المستودع العام + رابطها في الموقع ──
      - name: Publish to public releases repo
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: apk-${{ github.run_number }}
          name: سعي — نسخة ${{ github.run_number }}
          body: ملف APK لتطبيق سعي (أندرويد). حمّل saey.apk وثبّته على الهاتف.
          make_latest: true
          files: out/saey.apk

      - name: Point the site's download button at the new version
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          SIZE=$(( ($(stat -c %s out/saey.apk) + 524288) / 1048576 ))
          URL="https://github.com/$RELEASES_REPO/releases/download/apk-$N/saey.apk"
          # نتأكد أن الملف صار متاحاً للعامة قبل تغيير الرابط
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "$URL" || true)
            [ "$code" = "206" ] || [ "$code" = "200" ] && break
            echo "الملف غير متاح بعد ($code)… انتظار"; sleep 10
          done
          [ "$code" = "206" ] || [ "$code" = "200" ] || { echo "::error::الملف غير متاح للعامة: $URL (هل المستودع Public؟)"; exit 1; }
          git config user.name "saey-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
            printf '{\n  "link": "%s",\n  "version": "%s",\n  "size_mb": "%s"\n}\n' "$URL" "$N" "$SIZE" > apps/site/download-config.json
            git add apps/site/download-config.json
            git diff --cached --quiet && break
            git commit -m "نسخة التطبيق $N: رابط التنزيل والتحديث"
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 3))
          done
          # الدفع بـ GITHUB_TOKEN لا يشغّل سير عمل آخر، فنشغّل نشر الموقع يدوياً
          gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME"
          echo "✓ الموقع سيعرض النسخة $N ($SIZE MB): $URL"
