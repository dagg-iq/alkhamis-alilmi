# يبني ملف APK لتطبيق سعي وينشره في صفحة Releases
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, claude/repository-name-arabic-iegosv]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  # لا نلغي بناءً جارياً عند رفع تعديل جديد؛ الجديد ينتظر دوره
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          # سطر جديد أولاً: آخر سطر في الملف بلا نهاية سطر، والإلحاق المباشر كان يفسد قيمة watchedDirectories
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../../gradle.log
          exit ${PIPESTATUS[0]}

      - name: Show error details
        if: failure()
        run: |
          echo "===== node / error lines ====="
          grep -n -i -E "node|error|exception|caused by|what went wrong|at .*gradle" gradle.log | grep -v -i "warning" | head -150 || true
          echo "===== problems report ====="
          f=apps/mobile/android/build/reports/problems/problems-report.html
          [ -f "$f" ] && sed -e 's/<[^>]*>/ /g' "$f" | tr -s ' \n' | grep -i -E "node|exec|fail|error" | head -60 || true

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/saey.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: saey-apk
          path: out/saey.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: سعي — نسخة ${{ github.run_number }}
          body: |
            ملف APK لتطبيق سعي (أندرويد). حمّل saey.apk وثبّته على الهاتف.
            الفرع: ${{ github.ref_name }} — الكود: ${{ github.sha }}
          prerelease: true
          files: out/saey.apk
