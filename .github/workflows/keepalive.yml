# يُبقي مشروع Supabase المجاني نشطاً (يتوقف بعد ٧ أيام بلا نشاط)
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret not set"; exit 0; fi
          curl -sf "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null -w "%{http_code}\n"
