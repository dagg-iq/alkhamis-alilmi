# يرفع دوال الخادم (Edge Functions) إلى Supabase ويضبط أسرارها وربط الإشعارات — بلا حاسوب ولا طرفية.
# يكفي أن تضيف الأسرار في GitHub ← Settings ← Secrets and variables ← Actions (انظر system/08-setup-guide.md).
# يعمل تلقائياً عند تعديل الدوال، أو يدوياً من تبويب Actions ← Deploy Supabase ← Run workflow.
name: Deploy Supabase
on:
  workflow_dispatch:
  push:
    branches: [main, claude/repository-name-arabic-iegosv]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check access token
        id: check
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::لم يُضف السر SUPABASE_ACCESS_TOKEN بعد — تخطّي الرفع. راجع الخطوة ٦ في دليل الإعداد."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Set function secrets
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ADMIN_API_KEY: ${{ secrets.GEMINI_ADMIN_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          # نكتب فقط الأسرار الموجودة (الفارغة لا تمسح القيم القديمة)
          : > secrets.env
          for k in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 GEMINI_API_KEY_6 GEMINI_API_KEY_7 GEMINI_API_KEY_8 GEMINI_ADMIN_API_KEY YOUTUBE_API_KEY FCM_SERVICE_ACCOUNT PUSH_WEBHOOK_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET S3_ENDPOINT S3_REGION OCI_TENANCY OCI_USER OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION OCI_INSTANCE_ID; do
            v="${!k}"
            if [ -n "$v" ]; then
              # القيمة في سطر واحد (ملف JSON لحساب Firebase متعدد الأسطر)
              one=$(printf '%s' "$v" | tr -d '\n\r')
              printf '%s=%s\n' "$k" "$one" >> secrets.env
              echo "✓ $k"
            fi
          done
          if [ -s secrets.env ]; then
            supabase secrets set --env-file secrets.env --project-ref "$PROJECT_REF"
          fi
          rm -f secrets.env

      - name: Deploy functions
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            echo "== $name"
            # خطأ داخلي مؤقت من Supabase لا يوقف النشر: ٣ محاولات
            for try in 1 2 3; do
              supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api && break
              [ "$try" = 3 ] && exit 1
              echo "retry $name in 10s"; sleep 10
            done
          done

      - name: Apply new migrations (12 and later)
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # الملفات من ١ إلى ١١ طُبّقت يدوياً من قبل؛ الجديدة آمنة لإعادة التشغيل فتُطبّق في كل نشر
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | sed -E 's/^[0-9]{8}0*([0-9]+)_.*/\1/')
            [ "$n" -ge 12 ] 2>/dev/null || continue
            echo "== $f"
            jq -n --arg q "$(cat "$f")" '{query: $q}' | curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- > /dev/null
            echo "✓ طُبّق"
          done

      - name: Connect push notifications to the database
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PUSH_WEBHOOK_SECRET" ]; then
            echo "::warning::السر PUSH_WEBHOOK_SECRET غير موجود — الإشعارات لن تُربط."
            exit 0
          fi
          q() {
            jq -n --arg q "$1" '{query: $q}' | curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @-
            echo
          }
          # ١) إنشاء المشغّلات (آمن لإعادة التشغيل)
          q "$(cat supabase/migrations/20261006000011_push_hooks.sql)"
          # ٢) الرابط والسر (السر لا يُطبع في السجل)
          url="https://$PROJECT_REF.supabase.co/functions/v1/push"
          secret_sql=$(printf '%s' "$PUSH_WEBHOOK_SECRET" | sed "s/'/''/g")
          q "insert into private.settings (key, value) values ('push_url', '$url'), ('push_secret', '$secret_sql') on conflict (key) do update set value = excluded.value, updated_at = now();" > /dev/null
          echo "✓ الإشعارات مربوطة"

      - name: Storage self-test (upload → download)
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # نأخذ مفتاح الخادم مؤقتاً من واجهة الإدارة (لا يُطبع) ونجرب نفس طريقة التطبيق: رابط رفع موقّع ثم تحميل
          K=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[.[] | select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$K"
          U="https://$PROJECT_REF.supabase.co/storage/v1"
          H=(-H "apikey: $K" -H "Authorization: Bearer $K")
          curl -sS -X POST "$U/bucket" "${H[@]}" -H "Content-Type: application/json" \
            -d '{"id":"files","name":"files","public":false,"file_size_limit":52428800}' > /dev/null || true
          P=$(curl -sS -X POST "$U/object/upload/sign/files/selftest/check.txt" "${H[@]}" | jq -r '.url')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$U$P" -H 'Content-Type: text/plain' --data-binary 'saey-ok')
          echo "PUT → $code"
          G=$(curl -sS -X POST "$U/object/sign/files/selftest/check.txt" "${H[@]}" -H "Content-Type: application/json" -d '{"expiresIn":60}' | jq -r '.signedURL')
          got=$(curl -sS "$U$G")
          curl -sS -X DELETE "$U/object/files" "${H[@]}" -H "Content-Type: application/json" -d '{"prefixes":["selftest/check.txt"]}' > /dev/null
          if [ "$got" = "saey-ok" ]; then echo "✓ التخزين يعمل (رفع وتحميل)"; else echo "::error::فشل اختبار التخزين: PUT=$code GET=$got"; exit 1; fi
