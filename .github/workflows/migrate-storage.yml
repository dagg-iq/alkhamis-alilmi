# ينسخ ملفات Supabase Storage (حاوية files) إلى تخزين سيرفر Oracle (S3).
# يعمل عند الرفع إلى فرع storage-oracle-migration، وآمن لإعادة التشغيل (يتخطى المنسوخ).
name: Migrate storage to Oracle
on:
  workflow_dispatch:
  push:
    branches: [storage-oracle-migration]

env:
  PROJECT_REF: yjxhprmtyuqnbgraocar

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock aws4fetch@1.0.20
        working-directory: scripts
      - name: Copy files
        working-directory: scripts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          # مفتاح الخادم يُؤخذ مؤقتاً من واجهة الإدارة ولا يُطبع
          K=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[.[] | select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$K"
          SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$K" node migrate-storage.mjs
